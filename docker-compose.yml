services:

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8085:8080"
    networks:
      - banking-net
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  hz1:
    image: hazelcast/hazelcast:5.5
    container_name: hz1
    environment:
      - HZ_CLUSTERNAME=dev
    networks:
      - banking-net

  hz2:
    image: hazelcast/hazelcast:5.5
    container_name: hz2
    environment:
      - HZ_CLUSTERNAME=dev
    networks:
      - banking-net

  hz3:
    image: hazelcast/hazelcast:5.5
    container_name: hz3
    environment:
      - HZ_CLUSTERNAME=dev
    networks:
      - banking-net

  mongo:
    image: mongo:6
    container_name: mongo
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  logging-service-1:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    container_name: logging-service-1
    environment:
      - INSTANCE_ID=1
      - HZ_MEMBER=hz1:5701
      - PORT=8001
      - CONFIG_SERVER=http://config-server:8080
      - PYTHONUNBUFFERED=1
      - MY_URL=http://logging-service-1:8001
    networks:
      - banking-net
    depends_on:
      config-server:
        condition: service_healthy
      hz1:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  logging-service-2:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    container_name: logging-service-2
    environment:
      - INSTANCE_ID=2
      - HZ_MEMBER=hz2:5701
      - PORT=8001
      - CONFIG_SERVER=http://config-server:8080
      - PYTHONUNBUFFERED=1
      - MY_URL=http://logging-service-2:8001
    networks:
      - banking-net
    depends_on:
      config-server:
        condition: service_healthy
      hz2:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  logging-service-3:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    container_name: logging-service-3
    environment:
      - INSTANCE_ID=3
      - HZ_MEMBER=hz3:5701
      - PORT=8001
      - CONFIG_SERVER=http://config-server:8080
      - PYTHONUNBUFFERED=1
      - MY_URL=http://logging-service-3:8001
    networks:
      - banking-net
    depends_on:
      config-server:
        condition: service_healthy
      hz3:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  counter-service:
    build:
      context: .
      dockerfile: counter-service/Dockerfile
    container_name: counter-service
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=counter_db
      - HZ_MEMBERS=hz1:5701,hz2:5701,hz3:5701
      - CONFIG_SERVER=http://config-server:8080
      - PYTHONUNBUFFERED=1
      - MY_URL=http://counter-service:8002
    networks:
      - banking-net
    depends_on:
      config-server:
        condition: service_healthy
      mongo:
        condition: service_healthy
      hz1:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  facade-service:
    build:
      context: .
      dockerfile: facade-service/Dockerfile
    container_name: facade-service
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    networks:
      - banking-net
    depends_on:
      config-server:
        condition: service_healthy
      logging-service-1:
        condition: service_healthy
      logging-service-2:
        condition: service_healthy
      logging-service-3:
        condition: service_healthy
      counter-service:
        condition: service_healthy

networks:
  banking-net:
    driver: bridge